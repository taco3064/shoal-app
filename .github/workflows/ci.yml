name: Verify
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact event candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          SHOAL_PROJECTION_FILE: src/guide/services/directory/fixtures/network.json
          SHOAL_PUBLIC_CONTENT_FETCH: skip
      - run: npm run package:action
      - run: npm run test:action
      - run: npm run test:action-package
      - run: npm run test:seo
      - run: npm run test:network
      - run: npm run test:directory
      - run: npm run test:join
      - run: npm run test:join:worker
      - name: Install browser for Quick Web Join verification
        if: matrix.os == 'ubuntu-latest'
        run: npx playwright install --with-deps chromium
      - name: Verify Quick Web Join in Chromium
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:join:browser
      - name: Preserve Quick Web Join browser evidence
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: quick-join-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
      - run: npm run blueprint:validate
      - name: Scan current public Network
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        run: npm run scan:network
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHOAL_SCAN_DIAGNOSTICS: '1'
      - name: Preserve scanned projection for review
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: network-projection-${{ github.event.pull_request.head.sha }}
          path: dist/network-projection/network.json
          if-no-files-found: error
