name: Verify
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact event candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          SHOAL_PROJECTION_FILE: src/guide/services/directory/fixtures/development.json
          SHOAL_PUBLIC_CONTENT_FETCH: skip
      - run: npm run build:join
      - run: npm run package:action
      - run: npm run validate:action-package
      - run: npm run validate:seo
      - run: npm run validate:policy-headings
      - run: npm run validate:seo-cases
      - run: npm run validate:intake
      - run: npm run validate:workload
      - run: npm run blueprint:validate
      - name: Scan current public Network
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        run: npm run scan:network
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHOAL_SCAN_DIAGNOSTICS: '1'
      - name: Build and verify scanned Reviewer pages
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHOAL_PROJECTION_FILE: ${{ runner.temp }}/network.json
        run: |
          cp dist/network-projection/network.json "$SHOAL_PROJECTION_FILE"
          npm run build
          npm run validate:workload
          npm run validate:seo
      - name: Preserve scanned projection for review
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: network-projection-${{ github.event.pull_request.head.sha }}
          path: dist/data/network.json
          if-no-files-found: error
