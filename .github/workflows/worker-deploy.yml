name: Deploy Quick Web Join Worker

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: quick-web-join-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact verified main head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify deploy candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          echo "Deploying shoal-quick-web-join from $EXPECTED_SHA"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: Verify Worker package
        run: npm run build:join

      - name: Create production Wrangler config
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SHOAL_GITHUB_APP_ID: ${{ vars.SHOAL_GITHUB_APP_ID }}
          SHOAL_GITHUB_APP_SLUG: ${{ vars.SHOAL_GITHUB_APP_SLUG }}
          SHOAL_GITHUB_APP_CLIENT_ID: ${{ vars.SHOAL_GITHUB_APP_CLIENT_ID }}
          JOIN_SERVICE_ORIGIN: ${{ vars.PUBLIC_SHOAL_JOIN_SERVICE_URL }}
          JOIN_WEBSITE_RETURN_URL: ${{ vars.JOIN_WEBSITE_RETURN_URL }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const required = [
            'CLOUDFLARE_ACCOUNT_ID',
            'CLOUDFLARE_API_TOKEN',
            'SHOAL_GITHUB_APP_ID',
            'SHOAL_GITHUB_APP_SLUG',
            'SHOAL_GITHUB_APP_CLIENT_ID',
            'JOIN_SERVICE_ORIGIN',
            'JOIN_WEBSITE_RETURN_URL',
          ];

          const missing = required.filter((name) => !process.env[name]);

          if (missing.length) {
            throw new Error(`Missing required deployment config: ${missing.join(', ')}`);
          }

          // Dashboard/API bootstrap can provision JoinFlow without Wrangler's v1 tag.
          // Read the existing binding before deciding whether creation is required.
          const response = await fetch(
            `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID)}/workers/scripts/shoal-quick-web-join/settings`,
            { headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` } },
          );
          const settings = await response.json();
          const absent = response.status === 404 &&
            settings.errors?.some((error) => error.code === 10007);
          if (!absent && (!response.ok || settings.success !== true)) {
            throw new Error(`Cannot inspect existing Worker settings (HTTP ${response.status})`);
          }
          const bindings = absent ? [] : settings.result?.bindings;
          if (!Array.isArray(bindings)) {
            throw new Error('Existing Worker settings did not include bindings');
          }
          const existing = bindings.filter((binding) => binding.name === 'JOIN_FLOWS');
          if (existing.length > 1 || (existing.length === 1 && (
            existing[0].type !== 'durable_object_namespace' ||
            existing[0].class_name !== 'JoinFlow' ||
            !existing[0].namespace_id ||
            existing[0].environment ||
            existing[0].dispatch_namespace ||
            (existing[0].script_name && existing[0].script_name !== 'shoal-quick-web-join')
          ))) {
            throw new Error('Existing JOIN_FLOWS binding does not match the production JoinFlow namespace');
          }
          // Existing Workers without this binding need explicit investigation:
          // an unbound class may still exist, so absence of a binding is not proof
          // that new_sqlite_classes is safe.
          if (!absent && existing.length === 0) {
            throw new Error('Existing Worker has no JOIN_FLOWS binding; refusing implicit namespace creation');
          }

          const config = {
            $schema: 'node_modules/wrangler/config-schema.json',
            name: 'shoal-quick-web-join',
            main: 'src/join/worker.ts',
            account_id: process.env.CLOUDFLARE_ACCOUNT_ID,
            compatibility_date: '2026-10-01',
            compatibility_flags: ['nodejs_compat'],
            workers_dev: true,
            durable_objects: {
              bindings: [{ name: 'JOIN_FLOWS', class_name: 'JoinFlow' }],
            },
            ...(absent ? {
              migrations: [{ tag: 'v1', new_sqlite_classes: ['JoinFlow'] }],
            } : {}),
            vars: {
              GITHUB_APP_ID: process.env.SHOAL_GITHUB_APP_ID,
              GITHUB_APP_SLUG: process.env.SHOAL_GITHUB_APP_SLUG,
              GITHUB_APP_CLIENT_ID: process.env.SHOAL_GITHUB_APP_CLIENT_ID,
              JOIN_SERVICE_ORIGIN: process.env.JOIN_SERVICE_ORIGIN,
              JOIN_WEBSITE_RETURN_URL: process.env.JOIN_WEBSITE_RETURN_URL,
            },
          };

          console.log(absent
            ? 'Creating the initial JoinFlow SQLite namespace'
            : 'Preserving the existing JoinFlow namespace; no class migration');
          fs.writeFileSync(
            '.wrangler.production.json',
            JSON.stringify(config, null, 2),
          );
          NODE

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config .wrangler.production.json

      - name: Verify production health
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          JOIN_SERVICE_ORIGIN: ${{ vars.PUBLIC_SHOAL_JOIN_SERVICE_URL }}
        run: |
          echo "Verifying shoal-quick-web-join /health for $EXPECTED_SHA"
          health_url="${JOIN_SERVICE_ORIGIN%/}/health"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "$health_url"; then
              echo
              echo "Production Worker health succeeded for $EXPECTED_SHA"
              exit 0
            fi
            sleep 5
          done
          exit 1
