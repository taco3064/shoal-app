name: Network Scan

on:
  schedule:
    - cron: '35 4 * * 1'
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy Quick Web Join Worker]
    types: [completed]

permissions:
  contents: read

jobs:
  scan:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          persist-credentials: false
      - name: Verify accepted main head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run scan:network
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: cp dist/network-projection/network.json "$RUNNER_TEMP/network.json"
      - run: npm run build
        env:
          SHOAL_PROJECTION_FILE: ${{ runner.temp }}/network.json
          GITHUB_TOKEN: ${{ github.token }}
          PUBLIC_SHOAL_JOIN_SERVICE_URL: ${{ vars.PUBLIC_SHOAL_JOIN_SERVICE_URL }}
      - run: npm run validate:seo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
